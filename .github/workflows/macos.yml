name: macOS

on:
  push:
    paths:
      - 'macos/**'
      - '.github/workflows/macos.yml'
  pull_request:
    paths:
      - 'macos/**'
      - '.github/workflows/macos.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build and UI test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build (runs the self-check)
        run: bash macos/build.sh

      - name: UI test
        run: bash macos/ci/smoke.sh macos/build/Countdown.app macos/build/smoke

      - name: Disk image
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet "dmgbuild>=1.6,<2"
          PATH="$RUNNER_TEMP/venv/bin:$PATH" bash macos/make-dmg.sh

      - name: Disk image check and screenshots
        run: bash macos/ci/dmg-check.sh macos/build/Countdown.dmg macos/build/smoke

      - name: Upload the disk image and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Countdown-macOS-${{ matrix.os }}
          path: |
            macos/build/Countdown.dmg
            macos/build/smoke/
          if-no-files-found: warn
